<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Go Browser</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="browser-toolbar">

    <div class="navigation-buttons">
        <button id="back" title="Назад">←</button>
        <button id="forward" title="Вперёд">→</button>
        <button id="reload" title="Обновить">↻</button>
    </div>

    <div class="address-container">
        <input
            id="address"
            type="text"
            value="https://example.com"
            placeholder="Введите адрес сайта"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="go" title="Перейти">
            →
        </button>
    </div>

</header>

<main class="browser-content">

    <div class="welcome">
        <h1>Go Browser</h1>

        <p>
            Браузер на Go и Wails
        </p>

        <p class="hint">
            Введите адрес сайта выше
        </p>
    </div>

</main>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
