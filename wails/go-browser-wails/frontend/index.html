<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Go Browser</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="browser">

    <!-- Верхняя панель -->
    <header class="toolbar">

        <div class="brand">
            <div class="brand-icon">G</div>
            <span>Go Browser</span>
        </div>

        <div class="navigation">

            <button
                id="back"
                class="icon-button"
                title="Назад"
            >
                ←
            </button>

            <button
                id="forward"
                class="icon-button"
                title="Вперёд"
            >
                →
            </button>

            <button
                id="reload"
                class="icon-button"
                title="Обновить"
            >
                ↻
            </button>

            <button
                id="home"
                class="icon-button"
                title="Домой"
            >
                ⌂
            </button>

        </div>

        <form
            id="address-form"
            class="address-bar"
        >

            <span class="security-icon">
                🔒
            </span>

            <input
                id="address"
                type="text"
                placeholder="Введите адрес или поисковый запрос"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >

            <button
                type="submit"
                class="go-button"
                title="Перейти"
            >
                →
            </button>

        </form>

    </header>

    <!-- Состояние загрузки -->
    <div
        id="loading"
        class="loading-line"
    ></div>

    <!-- Стартовая страница -->
    <main
        id="start-page"
        class="start-page"
    >

        <div class="start-content">

            <div class="logo">
                G
            </div>

            <h1>
                Go Browser
            </h1>

            <p>
                Быстрый браузер на Go и Wails
            </p>

            <form
                id="search-form"
                class="search-box"
            >

                <span>⌕</span>

                <input
                    id="search"
                    type="text"
                    placeholder="Введите адрес или поисковый запрос"
                    autocomplete="off"
                >

                <button type="submit">
                    →
                </button>

            </form>

            <div class="shortcuts">

                <button data-url="https://www.google.com">
                    Google
                </button>

                <button data-url="https://github.com">
                    GitHub
                </button>

                <button data-url="https://www.youtube.com">
                    YouTube
                </button>

            </div>

        </div>

    </main>

</div>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
